<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF Edge Relay</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .status {
            background: rgba(0, 255, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
        .info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        a {
            color: #ffd700;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 CF Edge Relay</h1>
        
        <div class="status">
            ✅ دپلوی با موفقیت انجام شد
        </div>
        
        <div class="info">
            <h3>اطلاعات دپلوی:</h3>
            <p><strong>Cloudflare Workers:</strong> فعال</p>
            <p><strong>GitHub Pages:</strong> فعال</p>
            <p><strong>وضعیت:</strong> آماده به کار</p>
        </div>
        
        <div class="info">
            <h3>لینک‌های مفید:</h3>
            <ul>
                <li><a href="https://dash.cloudflare.com/" target="_blank">Cloudflare Dashboard</a></li>
                <li><a href="https://github.com/" target="_blank">GitHub Repository</a></li>
            </ul>
        </div>
        
        <p style="text-align: center; margin-top: 30px; opacity: 0.8;">
            ساخته شده با ❤️ برای کلودفلر ورکرز
        </p>
    </div>
</body>
</html>
