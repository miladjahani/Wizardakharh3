name: Deploy to Cloudflare Workers & GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy-workers:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers
        run: |
          # Auto-update wrangler.toml with GitHub repo info
          GITHUB_OWNER="${{ github.repository_owner }}"
          GITHUB_REPO=$(basename "${{ github.repository }}")
          sed -i "s|https://github.com/USERNAME/REPO|https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}|g" wrangler.toml
          sed -i "s|https://USERNAME.github.io/REPO|https://${GITHUB_OWNER}.github.io/${GITHUB_REPO}|g" wrangler.toml
          
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-workers
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
